<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AM ダッシュボード</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; line-height: 1.5; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 16px; }

  /* ---- layout utilities ---- */
  .flex { display: flex; }
  .flex-col { flex-direction: column; }
  .flex-1 { flex: 1 1 0%; }
  .items-center { align-items: center; }
  .items-start { align-items: flex-start; }
  .justify-between { justify-content: space-between; }
  .justify-center { justify-content: center; }
  .gap-1 { gap: 4px; } .gap-1\.5 { gap: 6px; } .gap-2 { gap: 8px; } .gap-2\.5 { gap: 10px; } .gap-3 { gap: 12px; }
  .grid { display: grid; }
  .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
  .hidden { display: none !important; }
  .shrink-0 { flex-shrink: 0; }
  .flex-wrap { flex-wrap: wrap; }
  .relative { position: relative; }
  .sticky { position: sticky; }
  .fixed { position: fixed; }
  .inset-0 { top:0; right:0; bottom:0; left:0; }
  .top-0 { top: 0; } .top-4 { top: 16px; } .bottom-0 { bottom: 0; } .left-0 { left: 0; } .right-0 { right: 0; }
  .left-1\/2 { left: 50%; } .left-3 { left: 12px; } .top-1\/2 { top: 50%; }
  .z-20 { z-index: 20; } .z-30 { z-index: 30; } .z-40 { z-index: 40; } .z-50 { z-index: 50; } .z-\[100\] { z-index: 100; }
  .w-full { width: 100%; } .h-full { height: 100%; }
  .min-h-screen { min-height: 100vh; }
  .max-w-lg { max-width: 480px; }
  .max-w-sm { max-width: 380px; }
  .mx-auto { margin-left: auto; margin-right: auto; }
  .text-center { text-align: center; }
  .text-right { text-align: right; }
  .overflow-hidden { overflow: hidden; }
  .overflow-y-auto { overflow-y: auto; }
  .resize-none { resize: none; }
  .leading-none { line-height: 1; }
  .leading-tight { line-height: 1.2; }
  .uppercase { text-transform: uppercase; }
  .tracking-wide { letter-spacing: 0.025em; }
  .tracking-widest { letter-spacing: 0.1em; }
  .cursor-pointer { cursor: pointer; }
  .outline-none { outline: none; }
  .transition-all { transition: all 0.15s ease; }
  .duration-300 { transition-duration: 0.3s; }
  .block { display: block; }
  .inline-block { display: inline-block; }
  .border { border: 1px solid #334155; }
  .border-t { border-top: 1px solid #334155; }
  .border-b { border-bottom: 1px solid #334155; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ---- spacing ---- */
  .p-3 { padding: 12px; } .p-4 { padding: 16px; } .p-5 { padding: 20px; }
  .px-2 { padding-left:8px; padding-right:8px; } .px-3 { padding-left:12px; padding-right:12px; }
  .px-4 { padding-left:16px; padding-right:16px; } .px-5 { padding-left:20px; padding-right:20px; }
  .py-1 { padding-top:4px; padding-bottom:4px; } .py-1\.5 { padding-top:6px; padding-bottom:6px; }
  .py-2 { padding-top:8px; padding-bottom:8px; } .py-2\.5 { padding-top:10px; padding-bottom:10px; }
  .py-3 { padding-top:12px; padding-bottom:12px; } .py-3\.5 { padding-top:14px; padding-bottom:14px; }
  .py-4 { padding-top:16px; padding-bottom:16px; } .py-16 { padding-top:64px; padding-bottom:64px; }
  .pt-4 { padding-top: 16px; } .pb-3 { padding-bottom: 12px; } .pb-36 { padding-bottom: 144px; }
  .pl-7 { padding-left: 28px; } .pr-3 { padding-right: 12px; }
  .mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-2\.5 { margin-bottom: 10px; }
  .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
  .mt-0\.5 { margin-top: 2px; } .mt-1 { margin-top: 4px; } .mt-3 { margin-top: 12px; }

  /* ---- sizing ---- */
  .w-6 { width: 24px; } .w-7 { width: 28px; } .w-8 { width: 32px; }
  .w-12 { width: 48px; } .w-16 { width: 64px; } .w-24 { width: 96px; }
  .h-7 { height: 28px; } .h-8 { height: 32px; }
  .border-slate-700 { border-color: #334155; }
  .line-through { text-decoration: line-through; }
  .tab-content { }

  /* ---- text ---- */
  .text-xs { font-size: 12px; } .text-sm { font-size: 14px; } .text-base { font-size: 16px; }
  .text-lg { font-size: 18px; } .text-2xl { font-size: 24px; } .text-5xl { font-size: 48px; }
  .font-medium { font-weight: 500; } .font-bold { font-weight: 700; }

  /* ---- colors: text ---- */
  .text-white { color: #ffffff; }
  .text-slate-200 { color: #e2e8f0; } .text-slate-300 { color: #cbd5e1; } .text-slate-400 { color: #94a3b8; }
  .text-slate-500 { color: #64748b; } .text-slate-600 { color: #475569; }
  .text-blue-400 { color: #60a5fa; }
  .text-amber-300 { color: #fcd34d; } .text-amber-400 { color: #fbbf24; }
  .text-red-400 { color: #f87171; } .text-emerald-400 { color: #34d399; }

  /* ---- colors: bg ---- */
  .bg-slate-900 { background: #0f172a; } .bg-slate-800 { background: #1e293b; }
  .bg-slate-700 { background: #334155; } .bg-slate-600 { background: #475569; }
  .bg-blue-600 { background: #2563eb; } .bg-blue-500 { background: #3b82f6; }
  .bg-red-500 { background: #ef4444; } .bg-amber-400 { background: #fbbf24; }
  .bg-emerald-500 { background: #10b981; } .bg-purple-500 { background: #a855f7; }
  .bg-green-600 { background: #16a34a; } .bg-red-600 { background: #dc2626; }
  .bg-amber-900\/30 { background: rgba(120, 53, 15, 0.3); }
  .bg-black\/70 { background: rgba(0,0,0,0.7); } .bg-black\/80 { background: rgba(0,0,0,0.8); }
  button.bg-blue-600:active, button.bg-blue-500:active { background: #1d4ed8; }
  button.bg-slate-700:active { background: #475569; }
  button.bg-slate-600:active { background: #334155; }
  @media (hover:hover) {
    .hover\:bg-slate-600:hover { background: #475569; }
    .hover\:bg-blue-500:hover { background: #3b82f6; }
    .hover\:bg-blue-900\/30:hover { background: rgba(30,58,138,0.3); }
    .hover\:text-red-400:hover { color: #f87171; }
    .hover\:border-slate-500:hover { border-color: #64748b; }
  }

  /* ---- radius / shadow ---- */
  .rounded-md { border-radius: 6px; } .rounded-lg { border-radius: 10px; }
  .rounded-xl { border-radius: 14px; } .rounded-2xl { border-radius: 18px; }
  .rounded-t-2xl { border-radius: 18px 18px 0 0; } .rounded-full { border-radius: 9999px; }
  .shadow-lg { box-shadow: 0 8px 24px rgba(0,0,0,0.35); }

  /* ---- transforms ---- */
  .-translate-x-1\/2 { transform: translateX(-50%); }
  .-translate-y-1\/2 { transform: translateY(-50%); }
  .active\:scale-95:active { transform: scale(0.95); }
  .active\:scale-\[0\.98\]:active { transform: scale(0.98); }

  .items-end { align-items: flex-end; }
  .gap-4 { gap: 16px; }
  .px-1 { padding-left:4px; padding-right:4px; }
  .py-1 { padding-top:4px; padding-bottom:4px; }
  .w-12 { width: 48px; }
  .border-blue-800 { border-color: #1e40af; }
  .transition-colors { transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease; }
  input:focus, textarea:focus, select:focus, button:focus { box-shadow: 0 0 0 2px #3b82f6; outline: none; }

  /* ---- app-specific ---- */
  .alert-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
  .tab-btn.active { background: #1e40af !important; color: #fff !important; }
  .tab-btn { transition: background 0.15s; border: none; }
  input, textarea, select { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
  input::placeholder, textarea::placeholder { color: #64748b; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #1e293b; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  .modal-scroll { max-height: calc(100dvh - 120px); overflow-y: auto; }
  .status-toggle { cursor: pointer; border-radius: 6px; padding: 2px 8px; font-size: 11px; font-weight: 700; border: none; transition: all 0.15s; }
  .egogram-tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
  .card-enter { animation: slideUp 0.2s ease-out; }
  @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .checklist-item input[type=checkbox] { accent-color: #3b82f6; width: 18px; height: 18px; }
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="sticky top-0 z-20 bg-slate-900 border-b border-slate-700 px-4 py-3 flex items-center justify-between">
  <div>
    <div class="text-xs text-slate-400 font-medium tracking-widest uppercase">Area Manager</div>
    <div class="text-lg font-bold text-white leading-tight">店舗ダッシュボード</div>
  </div>
  <button onclick="openAddStore()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold px-4 py-2 rounded-xl flex items-center gap-1.5 active:scale-95 transition-all">
    <span class="text-lg leading-none">＋</span> 店舗追加
  </button>
</header>

<!-- ===== DASHBOARD ===== -->
<main class="px-3 py-4 pb-36 max-w-lg mx-auto">
  <div id="storeList" class="flex flex-col gap-3"></div>
  <div id="emptyState" class="hidden text-center py-16">
    <div class="text-5xl mb-4">🏪</div>
    <div class="text-slate-400 text-base font-medium">まだ店舗が登録されていません</div>
    <div class="text-slate-500 text-sm mt-1">右上の「店舗追加」から始めましょう</div>
  </div>
</main>

<!-- ===== BACKUP FOOTER ===== -->
<footer class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 px-4 py-3 max-w-lg mx-auto">
  <div class="flex gap-2">
    <button onclick="exportData()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium py-2.5 rounded-xl active:scale-95 transition-all">📋 書き出し</button>
    <button onclick="openImport()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium py-2.5 rounded-xl active:scale-95 transition-all">📥 復元</button>
  </div>
</footer>

<!-- ===== ADD STORE MODAL ===== -->
<div id="addStoreModal" class="hidden fixed inset-0 z-30 bg-black/70 flex items-end">
  <div class="bg-slate-800 w-full max-w-lg mx-auto rounded-t-2xl p-5">
    <h2 class="text-lg font-bold text-white mb-4">店舗を追加</h2>
    <input id="newStoreName" type="text" placeholder="店舗名（例：CONA 渋谷店）" class="w-full rounded-xl px-4 py-3 text-base mb-4 outline-none focus:ring-2 focus:ring-blue-500">
    <div class="flex gap-2">
      <button onclick="closeAddStore()" class="flex-1 bg-slate-600 text-white py-3 rounded-xl font-medium active:scale-95 transition-all">キャンセル</button>
      <button onclick="addStore()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold active:scale-95 transition-all">追加</button>
    </div>
  </div>
</div>

<!-- ===== DETAIL MODAL ===== -->
<div id="detailModal" class="hidden fixed inset-0 z-40 bg-black/80 flex flex-col">
  <div class="flex flex-col h-full max-w-lg mx-auto w-full">
    <!-- Modal Header -->
    <div class="bg-slate-800 px-4 pt-4 pb-3 border-b border-slate-700 flex items-start justify-between gap-3">
      <div class="flex-1">
        <div id="modalStoreName" class="text-lg font-bold text-white"></div>
      </div>
      <button onclick="closeDetail()" class="text-slate-400 text-2xl leading-none mt-0.5 w-8 h-8 flex items-center justify-center">✕</button>
    </div>
    <!-- Tabs -->
    <div class="bg-slate-800 px-4 pb-3 flex gap-2">
      <button class="tab-btn active flex-1 text-xs font-bold py-2 rounded-lg" onclick="switchTab(0)">🏪 店舗</button>
      <button class="tab-btn flex-1 text-xs font-bold py-2 rounded-lg bg-slate-700 text-slate-300" onclick="switchTab(1)">👤 店長</button>
      <button class="tab-btn flex-1 text-xs font-bold py-2 rounded-lg bg-slate-700 text-slate-300" onclick="switchTab(2)">🧠 メンバー</button>
    </div>
    <!-- Tab Content -->
    <div class="flex-1 bg-slate-900 modal-scroll">
      <!-- TAB 0: Store Info -->
      <div id="tab0" class="tab-content p-4 flex flex-col gap-4">
        <!-- Current Issues -->
        <section class="bg-slate-800 rounded-2xl p-4">
          <h3 class="text-sm font-bold text-blue-400 mb-3 tracking-wide uppercase">⚠️ 現状の課題</h3>
          <textarea id="storeIssues" rows="5" placeholder="例：土日の客数が前年比-15%、ホールの接客スキルにばらつきあり、食材ロスが増加傾向..." class="w-full rounded-xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </section>
        <!-- Checklist -->
        <section class="bg-slate-800 rounded-2xl p-4">
          <h3 class="text-sm font-bold text-blue-400 mb-3 tracking-wide uppercase">✅ 訪問時 必確認事項</h3>
          <div id="checklistItems" class="flex flex-col gap-2.5"></div>
          <button onclick="addChecklistItem()" class="mt-3 w-full text-sm text-blue-400 border border-blue-800 rounded-xl py-2 hover:bg-blue-900/30 active:scale-95 transition-all">＋ 項目を追加</button>
        </section>
      </div>

      <!-- TAB 1: Manager Profile -->
      <div id="tab1" class="tab-content hidden p-4 flex flex-col gap-4">
        <section class="bg-slate-800 rounded-2xl p-4">
          <h3 class="text-sm font-bold text-blue-400 mb-3 tracking-wide uppercase">🎯 店長の現在課題・個人目標</h3>
          <textarea id="managerGoal" rows="4" placeholder="例：客単価UP施策の実行、新人教育の仕組み化..." class="w-full rounded-xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </section>
        <section class="bg-slate-800 rounded-2xl p-4">
          <h3 class="text-sm font-bold text-blue-400 mb-3 tracking-wide uppercase">📝 前回面談メモ・宿題</h3>
          <div class="text-xs text-slate-500 mb-2">前回面談日</div>
          <input id="lastMeetingDate" type="date" class="w-full rounded-xl px-4 py-2.5 text-base mb-3 outline-none focus:ring-2 focus:ring-blue-500">
          <textarea id="meetingMemo" rows="5" placeholder="前回の面談内容、約束事、宿題など..." class="w-full rounded-xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </section>
        <section class="bg-slate-800 rounded-2xl p-4">
          <h3 class="text-sm font-bold text-blue-400 mb-3 tracking-wide uppercase">💬 この店長への接し方メモ</h3>
          <textarea id="managerTips" rows="25" placeholder="例：数字より現場ストーリーで話すと響く。承認ファーストで..." class="w-full rounded-xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-blue-500 resize-none"></textarea>
        </section>
      </div>

      <!-- TAB 2: Staff -->
      <div id="tab2" class="tab-content hidden p-4 flex flex-col gap-3">
        <div id="staffList" class="flex flex-col gap-3"></div>
        <button onclick="addStaff()" class="w-full text-sm font-bold text-blue-400 border border-blue-800 rounded-xl py-3 hover:bg-blue-900/30 active:scale-95 transition-all">＋ メンバーを追加</button>
      </div>
    </div>

    <!-- Save Button -->
    <div class="bg-slate-800 border-t border-slate-700 p-4">
      <button onclick="saveDetail()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl text-base active:scale-95 transition-all">💾 保存する</button>
    </div>
  </div>
</div>

<!-- ===== IMPORT MODAL ===== -->
<div id="importModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center px-4">
  <div class="bg-slate-800 w-full max-w-sm rounded-2xl p-5">
    <h2 class="text-base font-bold text-white mb-3">データを復元</h2>
    <p class="text-xs text-slate-400 mb-3">書き出したJSONテキストを貼り付けてください</p>
    <textarea id="importText" rows="8" placeholder='{"stores":[...]}' class="w-full rounded-xl px-3 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500 resize-none mb-3"></textarea>
    <div class="flex gap-2">
      <button onclick="closeImport()" class="flex-1 bg-slate-600 text-white py-3 rounded-xl font-medium active:scale-95 transition-all">キャンセル</button>
      <button onclick="importData()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold active:scale-95 transition-all">復元する</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-[100] bg-green-600 text-white text-sm font-bold px-5 py-2.5 rounded-full shadow-lg"></div>

<script>
// ========== DATA MODEL ==========

let stores = [];
let currentStoreId = null;
let currentTab = 0;

function loadData() {
  try { stores = JSON.parse(localStorage.getItem('am_stores') || '[]'); } catch { stores = []; }
}
function saveData() {
  localStorage.setItem('am_stores', JSON.stringify(stores));
}
function getStore(id) { return stores.find(s => s.id === id); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ========== STORE DEFAULT ==========
function newStoreData(name) {
  return {
    id: genId(),
    name,
    storeIssues: '',
    checklist: ['','',''],
    checklistDone: [false, false, false],
    managerGoal: '', lastMeetingDate: '', meetingMemo: '', managerTips: '',
    staff: []
  };
}

// ========== RENDER DASHBOARD ==========
function renderDashboard() {
  const list = document.getElementById('storeList');
  const empty = document.getElementById('emptyState');
  list.innerHTML = '';
  if (stores.length === 0) { empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  stores.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card-enter bg-slate-800 rounded-2xl p-4 cursor-pointer active:scale-[0.98] transition-all border border-slate-700 hover:border-slate-500';
    card.onclick = () => openDetail(s.id);

    // (no sales summary needed)

    card.innerHTML = `
      <div class="flex items-start justify-between mb-2">
        <span class="text-base font-bold text-white">${s.name}</span>
        <button onclick="event.stopPropagation(); deleteStore('${s.id}')" class="text-slate-600 hover:text-red-400 text-xs transition-colors px-2 py-1">削除</button>
      </div>
      ${s.storeIssues ? `<div class="text-xs text-amber-300 bg-amber-900/30 rounded-xl px-3 py-2 line-clamp-2">⚠️ ${s.storeIssues}</div>` : '<div class="text-xs text-slate-600">課題未入力</div>'}
    `;
    list.appendChild(card);
  });
}

// ========== ADD STORE ==========
function openAddStore() { document.getElementById('addStoreModal').classList.remove('hidden'); document.getElementById('newStoreName').focus(); }
function closeAddStore() { document.getElementById('addStoreModal').classList.add('hidden'); document.getElementById('newStoreName').value=''; }
function addStore() {
  const name = document.getElementById('newStoreName').value.trim();
  if (!name) { showToast('店舗名を入力してください', 'error'); return; }
  stores.push(newStoreData(name));
  saveData(); renderDashboard(); closeAddStore();
  showToast('店舗を追加しました');
}
function deleteStore(id) {
  if (!confirm('この店舗を削除しますか？')) return;
  stores = stores.filter(s => s.id !== id);
  saveData(); renderDashboard();
  showToast('削除しました');
}

// ========== DETAIL MODAL ==========
function openDetail(id) {
  currentStoreId = id;
  currentTab = 0;
  const s = getStore(id);
  if (!s) return;
  document.getElementById('modalStoreName').textContent = s.name;
  document.getElementById('detailModal').classList.remove('hidden');
  fillDetailForm(s);
  switchTab(0);
}
function closeDetail() {
  document.getElementById('detailModal').classList.add('hidden');
  currentStoreId = null;
}
function fillDetailForm(s) {
  document.getElementById('storeIssues').value = s.storeIssues || '';
  document.getElementById('managerGoal').value = s.managerGoal || '';
  document.getElementById('lastMeetingDate').value = s.lastMeetingDate || '';
  document.getElementById('meetingMemo').value = s.meetingMemo || '';
  document.getElementById('managerTips').value = s.managerTips || '';
  renderChecklist(s);
  renderStaffList(s);
}

// ========== CHECKLIST ==========
function renderChecklist(s) {
  const container = document.getElementById('checklistItems');
  container.innerHTML = '';
  (s.checklist || []).forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'checklist-item flex items-center gap-2.5';
    row.innerHTML = `
      <input type="checkbox" ${s.checklistDone[i] ? 'checked' : ''} onchange="toggleCheck(${i}, this.checked)" class="shrink-0">
      <input type="text" value="${item}" placeholder="確認事項 ${i+1}" 
        oninput="updateChecklist(${i}, this.value)"
        class="flex-1 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 ${s.checklistDone[i] ? 'line-through text-slate-500' : ''}">
      <button onclick="removeChecklistItem(${i})" class="text-slate-600 hover:text-red-400 text-lg leading-none w-7 h-7 flex items-center justify-center transition-colors">×</button>
    `;
    container.appendChild(row);
  });
}
function addChecklistItem() {
  const s = getStore(currentStoreId); if (!s) return;
  s.checklist.push(''); s.checklistDone.push(false);
  renderChecklist(s);
}
function updateChecklist(i, val) {
  const s = getStore(currentStoreId); if (!s) return; s.checklist[i] = val;
}
function toggleCheck(i, val) {
  const s = getStore(currentStoreId); if (!s) return; s.checklistDone[i] = val;
  renderChecklist(s);
}
function removeChecklistItem(i) {
  const s = getStore(currentStoreId); if (!s) return;
  s.checklist.splice(i, 1); s.checklistDone.splice(i, 1);
  renderChecklist(s);
}

// ========== STAFF ==========
function renderStaffList(s) {
  const container = document.getElementById('staffList');
  container.innerHTML = '';
  if (!s.staff || s.staff.length === 0) {
    container.innerHTML = '<div class="text-center text-slate-600 text-sm py-6">メンバーがいません</div>';
    return;
  }
  s.staff.forEach((st, i) => {
    const div = document.createElement('div');
    div.className = 'bg-slate-800 rounded-2xl p-4 flex flex-col gap-3 border border-slate-700';
    div.innerHTML = `
      <div class="flex items-center gap-2 justify-between">
        <div class="flex gap-2 flex-1">
          <input type="text" value="${st.name||''}" placeholder="名前" oninput="updateStaff(${i},'name',this.value)"
            class="flex-1 rounded-lg px-3 py-2 text-base font-bold outline-none focus:ring-2 focus:ring-blue-500">
          <input type="text" value="${st.role||''}" placeholder="役職" oninput="updateStaff(${i},'role',this.value)"
            class="w-24 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <button onclick="removeStaff(${i})" class="text-slate-500 hover:text-red-400 transition-colors text-lg leading-none w-8 h-8 flex items-center justify-center shrink-0">✕</button>
      </div>
      <div>
        <div class="text-xs text-blue-400 font-bold mb-1 tracking-wide uppercase">🧠 特徴・接し方メモ</div>
        <textarea rows="25" placeholder="例：責任感が強く真面目。数字で示すと動きやすい。褒めると伸びるタイプ。シフト調整は早めに相談を..." oninput="updateStaff(${i},'tips',this.value)"
          class="w-full rounded-xl px-4 py-3 text-base outline-none focus:ring-2 focus:ring-blue-500 resize-none">${st.tips||''}</textarea>
      </div>
    `;
    container.appendChild(div);
  });
}
function addStaff() {
  const s = getStore(currentStoreId); if (!s) return;
  if (!s.staff) s.staff = [];
  s.staff.push({ name:'', role:'', tips:'' });
  renderStaffList(s);
}
function updateStaff(i, key, val) {
  const s = getStore(currentStoreId); if (!s) return;
  s.staff[i][key] = val;
}
function removeStaff(i) {
  const s = getStore(currentStoreId); if (!s) return;
  s.staff.splice(i, 1); renderStaffList(s);
}

// ========== TABS ==========
function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab-content').forEach((el, i) => {
    el.classList.toggle('hidden', i !== idx);
  });
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
    btn.classList.toggle('bg-slate-700', i !== idx);
    btn.classList.toggle('text-slate-300', i !== idx);
  });
}

// ========== SAVE ==========
function saveDetail() {
  const s = getStore(currentStoreId); if (!s) return;
  s.storeIssues = document.getElementById('storeIssues').value;
  s.managerGoal = document.getElementById('managerGoal').value;
  s.lastMeetingDate = document.getElementById('lastMeetingDate').value;
  s.meetingMemo = document.getElementById('meetingMemo').value;
  s.managerTips = document.getElementById('managerTips').value;
  saveData(); renderDashboard();
  showToast('保存しました ✓');
}

// ========== BACKUP ==========
function exportData() {
  const json = JSON.stringify({ stores }, null, 2);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(json).then(() => showToast('クリップボードにコピーしました'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = json; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('コピーしました');
  }
}
function openImport() { document.getElementById('importModal').classList.remove('hidden'); document.getElementById('importText').value=''; }
function closeImport() { document.getElementById('importModal').classList.add('hidden'); }
function importData() {
  try {
    const data = JSON.parse(document.getElementById('importText').value);
    if (!Array.isArray(data.stores)) throw new Error('形式が不正です');
    stores = data.stores;
    saveData(); renderDashboard(); closeImport();
    showToast(`${stores.length}件の店舗データを復元しました`);
  } catch(e) {
    showToast('形式が正しくありません。書き出したJSONをそのまま貼り付けてください', 'error');
  }
}

// ========== TOAST ==========
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `fixed top-4 left-1/2 -translate-x-1/2 z-[100] text-white text-sm font-bold px-5 py-2.5 rounded-full shadow-lg ${type==='error' ? 'bg-red-600' : 'bg-green-600'}`;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2400);
}

// ========== INIT ==========
loadData();
renderDashboard();

// Close modal on backdrop click
document.getElementById('addStoreModal').addEventListener('click', function(e) { if(e.target===this) closeAddStore(); });
document.getElementById('importModal').addEventListener('click', function(e) { if(e.target===this) closeImport(); });
</script>
